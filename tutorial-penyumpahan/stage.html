<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;
 background:radial-gradient(circle at 15% 10%,#e9e5ff,transparent 45%),radial-gradient(circle at 90% 90%,#d9f3ff,transparent 45%),#f5f6fb;color:#1f2340}
#hdr{position:absolute;left:48px;top:26px;right:48px;height:44px;display:flex;align-items:center;gap:14px}
#hdr .logo{height:44px;width:auto}
#hdr b{font-size:20px}#hdr span{color:#6b7090;font-size:16px}
#prog{margin-left:auto;width:360px;height:6px;border-radius:9px;background:#e1e3ef;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6c343,#e0a100);transition:width .8s}
#win{position:absolute;left:48px;top:90px;width:1440px;height:944px;border-radius:18px;overflow:hidden;background:#fff;
 box-shadow:0 30px 70px rgba(40,40,110,.18),0 0 0 1px rgba(0,0,0,.05)}
#bar{height:44px;background:#eef0f7;display:flex;align-items:center;gap:8px;padding:0 16px}
#bar i{width:12px;height:12px;border-radius:50%;background:#ff6159}#bar i:nth-child(2){background:#ffbd2e}#bar i:nth-child(3){background:#28c941}
#bar div{margin-left:18px;flex:1;height:28px;border-radius:8px;background:#fff;color:#6b7090;font-size:14px;display:flex;align-items:center;padding:0 12px}
iframe{width:1440px;height:900px;border:0;display:block}
#side{position:absolute;left:1520px;top:90px;width:352px;height:944px;display:flex;flex-direction:column;justify-content:center}
.card{position:absolute;left:0;right:0;padding:30px 28px;border-radius:24px;background:rgba(255,255,255,.75);backdrop-filter:blur(12px);
 box-shadow:0 20px 50px rgba(40,40,110,.12);border:1px solid rgba(255,255,255,.9);opacity:0;transform:translateY(30px);transition:opacity .7s,transform .7s}
.card.on{opacity:1;transform:none}.card.out{opacity:0;transform:translateY(-30px)}
.step{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.12em;color:#1b2550;background:#fdf1c7;padding:6px 12px;border-radius:99px}
.card h2{font-size:30px;line-height:1.2;margin:16px 0 14px;font-weight:800}
.card p{font-size:20px;line-height:1.6;color:#4a4f70}
.card p b{color:#b7860b}
.card .w{opacity:.15;transition:opacity .35s}.card .w.v{opacity:1}
#cur{position:absolute;left:700px;top:500px;width:26px;height:26px;z-index:9;pointer-events:none;transition:left .9s cubic-bezier(.5,0,.2,1),top .9s cubic-bezier(.5,0,.2,1)}
#cur svg{filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.rip{position:absolute;width:50px;height:50px;margin:-25px;border-radius:50%;border:3px solid #1b2550;z-index:8;pointer-events:none;animation:r .7s forwards}
@keyframes r{from{transform:scale(.2);opacity:1}to{transform:scale(1.3);opacity:0}}
#cover{position:absolute;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#1b2550,#34407a);color:#fff;transition:opacity 1s}
#cover h1{font-size:76px;font-weight:800;line-height:1.1}#cover p{font-size:28px;opacity:.9;margin-top:18px}
#cover.hide{opacity:0;pointer-events:none}
</style></head><body>
<div id="hdr"><img class="logo" src="logo-pengayoman.png" alt=""><b>Tutorial Dokumen Penyumpahan</b><span>· Balai Harta Peninggalan Medan</span><div id="prog"><i></i></div></div>
<div id="win"><div id="bar"><i></i><i></i><i></i><div>🔒 script.google.com/macros/s/AKfycbx0…/exec</div></div><iframe id="f" src="app.html"></iframe></div>
<div id="side"></div>
<div id="cur"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 2l16 10-7 1.5L9.5 21z" fill="#1f2340" stroke="#fff" stroke-width="1.5"/></svg></div>
<div id="cover"><div><div style="height:106px;position:relative"><img src="logo-pengayoman.png" alt="" style="position:absolute;left:50%;top:44%;height:116px;transform:translate(-50%,-50%)"></div><h1 id="ct">Dokumen<br>Penyumpahan</h1><p id="cs">Panduan penggunaan aplikasi · BHP Medan</p></div></div>
<script>
let n=0;
window.say=(step,title,text,total)=>{const s=document.getElementById('side');
 s.querySelectorAll('.card.on').forEach(c=>{c.classList.add('out');setTimeout(()=>c.remove(),800)});
 const c=document.createElement('div');c.className='card';
 const words=text.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ');
 c.innerHTML=`<span class="step">LANGKAH ${step} / ${total}</span><h2>${title}</h2><p>${words}</p>`;s.appendChild(c);
 c.style.top=(472-c.offsetHeight/2)+'px';
 setTimeout(()=>c.classList.add('on'),250);
 const ws=[...c.querySelectorAll('.w')];ws.forEach((w,i)=>setTimeout(()=>w.classList.add('v'),600+i*110));
 document.querySelector('#prog i').style.width=(step/total*100)+'%';};
window.cur=(x,y)=>{const c=document.getElementById('cur');c.style.left=x+'px';c.style.top=y+'px'};
window.rip=(x,y)=>{const r=document.createElement('div');r.className='rip';r.style.left=x+'px';r.style.top=y+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),800)};
window.cover=(show,t,s)=>{const c=document.getElementById('cover');if(t)document.getElementById('ct').innerHTML=t;if(s)document.getElementById('cs').innerHTML=s;c.classList.toggle('hide',!show)};
</script></body></html>
